name: agy-kit CI — Lint, Test, Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e . pytest pytest-cov mypy ruff pre-commit

      - name: Lint & Format Check
        run: |
          ruff check .

      - name: Type Check (mypy)
        run: |
          mypy src/agy_kit/ --ignore-missing-imports

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests/unit

      - name: Audit Template Drift
        run: |
          python3 bin/sync_templates.py --check

      - name: Run Benchmark Evaluation Suite
        run: |
          python3 tests/evals/eval_harness.py

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog Verified Secret Scan
        uses: trufflesecurity/trufflehog-actions@v3.6.0
        with:
          extra_args: --only-verified
